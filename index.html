<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マルチキャラ ロールプレイチャット</title>
  <style>
    :root {
      --bg-dark: #121212;
      --bg-header: #1e1e1e;
      --bg-chat: #0b0e14;
      --bg-input: #1e1e1e;
      --msg-user: #1f65d6;
      --msg-ai: #2a2d32;
      --text-main: #e1e1e1;
      --text-muted: #8e8e93;
      --accent: #3b82f6;
      --border-color: #2c2c2e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-chat);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* ヘッダー */
    .header {
      background-color: var(--bg-header);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: #fff;
    }
    .header-title { font-size: 16px; font-weight: 600; color: #fff; }
    .header-status { font-size: 11px; color: #10b981; transition: color 0.3s; }
    .header-status.typing { color: #f59e0b; }

    .header-actions { display: flex; gap: 10px; align-items: center; }

    /* クイックアクションバー */
    .action-bar {
      background-color: #161a23;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
    }
    .chip-btn {
      background-color: #232833;
      color: #b0b8c4;
      border: 1px solid #323846;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip-btn.accent {
      background-color: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.4);
    }

    /* チャットエリア */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-group { display: flex; flex-direction: column; gap: 4px; max-width: 85%; position: relative; }
    .msg-group.user { align-self: flex-end; align-items: flex-end; }
    .msg-group.ai { align-self: flex-start; align-items: flex-start; }
    .msg-sender { font-size: 11px; color: var(--text-muted); margin-left: 4px; display: flex; gap: 8px; align-items: center; }
    
    .msg-bubble-wrapper {
      display: flex;
      align-items: flex-center;
      gap: 6px;
      width: 100%;
    }
    .msg-group.user .msg-bubble-wrapper { flex-direction: row-reverse; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-group.user .msg-bubble {
      background-color: var(--msg-user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-group.ai .msg-bubble {
      background-color: var(--msg-ai);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-msg-action {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      opacity: 0.6;
      padding: 4px;
    }
    .btn-msg-action:hover { opacity: 1; }

    /* 入力中アニメーション */
    .typing-box {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* 入力エリア */
    .input-area {
      background-color: var(--bg-input);
      padding: 10px 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }
    .input-area textarea {
      flex: 1;
      background-color: #121212;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      resize: none;
      outline: none;
    }
    .btn-send {
      background-color: var(--accent);
      color: #fff;
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      cursor: pointer;
    }
    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ドロワー/モーダル */
    .modal {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none; flex-direction: column; justify-content: flex-end;
      z-index: 10;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg-header);
      padding: 20px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex; flex-direction: column; gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content input, .modal-content textarea, .modal-content select {
      background: #121212; border: 1px solid var(--border-color);
      color: #fff; padding: 10px; border-radius: 6px; font-size: 14px;
    }

    /* プロンプト＆メモリ入力欄の自動拡大 */
    .expandable-textarea {
      min-height: 80px;
      transition: min-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
    }
    .expandable-textarea:focus {
      min-height: 220px;
      border-color: var(--accent) !important;
      outline: none;
    }

    /* トーク・プリセット一覧リスト */
    .session-item, .preset-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121212;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }
    .session-item.active {
      border-color: var(--accent);
      background: #1a2332;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="header-info">
      <button onclick="toggleModal('sessionsModal', true)" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;margin-right:4px;">💬</button>
      <div class="avatar" id="currentAvatar">RP</div>
      <div>
        <div class="header-title" id="currentTitle">キャラ選択なし</div>
        <div class="header-status" id="modelStatus">gemini-3.8-flash</div>
      </div>
    </div>
    <div class="header-actions">
      <button onclick="toggleModal('presetModal', true)" title="プロンプトライブラリ" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">📚</button>
      <button onclick="toggleModal('settingsModal', true)" title="設定" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">⚙️</button>
    </div>
  </div>

  <div class="action-bar">
    <button class="chip-btn accent" onclick="endDay()">🌙 1日目を終了（概要出力）</button>
    <button class="chip-btn" onclick="retryLastUserMessage()">🔄 最後の返答を再生成</button>
    <button class="chip-btn" onclick="toggleModal('sessionsModal', true)">🔄 キャラ切替/新規作成</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="msg-group ai">
      <div class="msg-sender">システム</div>
      <div class="msg-bubble">左上の「💬」ボタンから新しいキャラを作るか、右上の「⚙️」でAPIキーを設定してね！</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="メッセージを入力..."></textarea>
    <button class="btn-send" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>

  <!-- キャラ・トーク一覧モーダル -->
  <div class="modal" id="sessionsModal">
    <div class="modal-content">
      <h3>💬 キャラ・トーク一覧</h3>
      <button onclick="createNewSession()" style="background:var(--accent);color:#fff;padding:10px;border:none;border-radius:6px;cursor:pointer;">＋ 新しいキャラ・トークを追加</button>
      <div id="sessionList" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto;"></div>
      <button onclick="toggleModal('sessionsModal', false)" style="background:#2c2c2e;color:#fff;padding:10px;border:none;border-radius:6px;">閉じる</button>
    </div>
  </div>

  <!-- プロンプトプリセットモーダル -->
  <div class="modal" id="presetModal">
    <div class="modal-content">
      <h3>📚 プロンプト（きゃらぷ）ライブラリ</h3>
      <div style="font-size:12px; color:var(--text-muted);">保存しておいたキャラ設定を現在のトークに適用できます。</div>
      
      <div style="display:flex; gap:8px;">
        <input type="text" id="newPresetName" placeholder="プリセット名（例：ツンデレ幼馴染）" style="flex:1;">
        <button onclick="saveCurrentAsPreset()" style="background:var(--accent);color:#fff;padding:8px 12px;border:none;border-radius:6px;cursor:pointer;white-space:nowrap;">現在の設定を保存</button>
      </div>

      <div id="presetList" style="display:flex; flex-direction:column; gap:8px; max-height:250px; overflow-y:auto;"></div>
      <button onclick="toggleModal('presetModal', false)" style="background:#2c2c2e;color:#fff;padding:10px;border:none;border-radius:6px;">閉じる</button>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>⚙️ 現在のキャラ・設定</h3>
      <label>Google AI Studio API Key（共通）</label>
      <input type="password" id="apiKey" placeholder="AIzaSy...">
      
      <label>使用するGeminiモデル</label>
      <select id="modelSelect">
        <option value="gemini-3.8-flash">gemini-3.8-flash (バランス・最新推奨)</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (軽量・爆速)</option>
        <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (軽量・省枠)</option>
        <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview (高精度・長文向け)</option>
        <option value="gemini-pro-latest">gemini-pro-latest (最新Pro自動選択)</option>
        <option value="gemini-flash-lite-latest">gemini-flash-lite-latest (最新Flash Lite自動選択)</option>
      </select>

      <label>キャラ表示名</label>
      <input type="text" id="sessionName" placeholder="例：ツンデレ幼馴染">

      <!-- ★追加：ユーザー設定項目★ -->
      <label style="color:#60a5fa; font-weight:bold;">👤 ユーザー設定（あなた側の容姿・立場など） <span style="font-size:10px; color:var(--accent);">※タップで大きく開くわ！</span></label>
      <textarea id="userPrompt" class="expandable-textarea" placeholder="例：名前：トウマ、男、17歳高校生。幼馴染の隣に住んでいる。少し鈍感。"></textarea>

      <label>System Instructions (きゃらぷ＋メタルール) <span style="font-size:10px; color:var(--accent);">※タップで大きく開くわ！</span></label>
      <textarea id="systemPrompt" class="expandable-textarea" placeholder="プロンプトを入力"></textarea>

      <label>永続記憶（メモリ枠・過去の概要など） <span style="font-size:10px; color:var(--accent);">※タップで大きく開くわ！</span></label>
      <textarea id="memoryPrompt" class="expandable-textarea" placeholder="記憶ノートを入力"></textarea>

      <div style="display:flex; gap:8px;">
        <button onclick="saveCurrentSettings()" style="flex:1; background:var(--accent);color:#fff;padding:10px;border:none;border-radius:6px;">保存</button>
        <button onclick="deleteCurrentSession()" style="background:var(--danger);color:#fff;padding:10px;border:none;border-radius:6px;">削除</button>
      </div>
      <button onclick="toggleModal('settingsModal', false)" style="background:#2c2c2e;color:#fff;padding:10px;border:none;border-radius:6px;">閉じる</button>
    </div>
  </div>
</div>

<script>
  let sessions = {};
  let presets = {};
  let currentSessionId = null;

  window.onload = () => {
    document.getElementById('apiKey').value = localStorage.getItem('rp_common_key') || '';
    document.getElementById('modelSelect').value = localStorage.getItem('rp_common_model') || 'gemini-3.8-flash';
    loadPresets();
    loadSessions();
  };

  function loadSessions() {
    const data = localStorage.getItem('rp_sessions');
    sessions = data ? JSON.parse(data) : {};
    
    const ids = Object.keys(sessions);
    if (ids.length === 0) {
      createNewSession('デフォルトキャラ');
    } else {
      switchSession(ids[0]);
    }
  }

  function saveSessions() {
    localStorage.setItem('rp_sessions', JSON.stringify(sessions));
    localStorage.setItem('rp_common_key', document.getElementById('apiKey').value);
    localStorage.setItem('rp_common_model', document.getElementById('modelSelect').value);
  }

  function loadPresets() {
    const data = localStorage.getItem('rp_presets');
    presets = data ? JSON.parse(data) : {};
    renderPresetList();
  }

  function savePresets() {
    localStorage.setItem('rp_presets', JSON.stringify(presets));
    renderPresetList();
  }

  function createNewSession(name = null) {
    const id = 'session_' + Date.now();
    const charName = name || prompt('新しいキャラの表示名を入力してください:', '新キャラ');
    if (!charName) return;

    sessions[id] = {
      id: id,
      name: charName,
      userSys: '', // ユーザー設定
      sys: '',
      mem: '',
      history: []
    };

    saveSessions();
    switchSession(id);
    toggleModal('sessionsModal', false);
    toggleModal('settingsModal', true);
  }

  function switchSession(id) {
    currentSessionId = id;
    const session = sessions[id];

    const currentModel = document.getElementById('modelSelect').value;
    document.getElementById('modelStatus').innerText = currentModel;

    document.getElementById('currentTitle').innerText = session.name;
    document.getElementById('currentAvatar').innerText = session.name.substring(0, 2);
    document.getElementById('sessionName').value = session.name;
    document.getElementById('userPrompt').value = session.userSys || ''; // ユーザー設定のロード
    document.getElementById('systemPrompt').value = session.sys || '';
    document.getElementById('memoryPrompt').value = session.mem || '';

    renderChatHistory();
    renderSessionList();
  }

  function renderSessionList() {
    const container = document.getElementById('sessionList');
    container.innerHTML = '';

    Object.values(sessions).forEach(s => {
      const div = document.createElement('div');
      div.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
      div.innerHTML = `
        <div>
          <strong>${s.name}</strong>
          <div style="font-size:11px; color:#8e8e93;">メッセージ: ${s.history.length}件</div>
        </div>
        <span style="font-size:12px; color:#3b82f6;">${s.id === currentSessionId ? '選択中' : '切り替え'}</span>
      `;
      div.onclick = () => {
        switchSession(s.id);
        toggleModal('sessionsModal', false);
      };
      container.appendChild(div);
    });
  }

  function saveCurrentSettings() {
    if (!currentSessionId) return;

    const session = sessions[currentSessionId];
    session.name = document.getElementById('sessionName').value || '無題のキャラ';
    session.userSys = document.getElementById('userPrompt').value; // ユーザー設定の保存
    session.sys = document.getElementById('systemPrompt').value;
    session.mem = document.getElementById('memoryPrompt').value;

    saveSessions();
    switchSession(currentSessionId);
    toggleModal('settingsModal', false);
  }

  function deleteCurrentSession() {
    if (!confirm('このキャラの履歴と設定を完全に削除しますか？')) return;
    delete sessions[currentSessionId];
    saveSessions();
    toggleModal('settingsModal', false);
    loadSessions();
  }

  /* プリセット機能 */
  function saveCurrentAsPreset() {
    const nameInput = document.getElementById('newPresetName');
    const name = nameInput.value.trim();
    if (!name) {
      alert('プリセット名を入力してください！');
      return;
    }

    const sysText = document.getElementById('systemPrompt').value;
    const userSysText = document.getElementById('userPrompt').value;
    if (!sysText && !userSysText) {
      alert('プロンプトまたはユーザー設定を入力した状態で保存してください！');
      return;
    }

    const id = 'preset_' + Date.now();
    presets[id] = { id, name, sys: sysText, userSys: userSysText };
    savePresets();
    nameInput.value = '';
    alert(`プリセット「${name}」を保存しました！`);
  }

  function applyPreset(id) {
    const preset = presets[id];
    if (!preset) return;

    if (confirm(`プリセット「${preset.name}」を現在のキャラに適用しますか？`)) {
      document.getElementById('systemPrompt').value = preset.sys || '';
      if (preset.userSys !== undefined) {
        document.getElementById('userPrompt').value = preset.userSys;
      }
      saveCurrentSettings();
      toggleModal('presetModal', false);
      alert('プロンプトとユーザー設定を読み込みました！');
    }
  }

  function deletePreset(id) {
    if (!confirm('このプリセットを削除しますか？')) return;
    delete presets[id];
    savePresets();
  }

  function renderPresetList() {
    const container = document.getElementById('presetList');
    container.innerHTML = '';

    const keys = Object.keys(presets);
    if (keys.length === 0) {
      container.innerHTML = '<div style="font-size:12px; color:var(--text-muted); text-align:center; padding:12px;">保存されたプリセットはありません</div>';
      return;
    }

    keys.forEach(id => {
      const p = presets[id];
      const div = document.createElement('div');
      div.className = 'preset-item';
      div.innerHTML = `
        <div style="flex:1;" onclick="applyPreset('${p.id}')">
          <strong>${p.name}</strong>
          <div style="font-size:11px; color:#8e8e93; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            ${p.sys || p.userSys || '空のプロンプト'}
          </div>
        </div>
        <button onclick="deletePreset('${p.id}')" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:14px;">🗑️</button>
      `;
      container.appendChild(div);
    });
  }

  function toggleModal(modalId, show) {
    document.getElementById(modalId).classList.toggle('active', show);
  }

  function deleteMessage(index) {
    if (!confirm('このメッセージを削除しますか？')) return;
    const session = sessions[currentSessionId];
    session.history.splice(index, 1);
    saveSessions();
    renderChatHistory();
  }

  function appendMsg(role, text, index = null) {
    const area = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = `msg-group ${role}`;

    let actionBtns = '';
    if (index !== null) {
      actionBtns = `<button class="btn-msg-action" onclick="deleteMessage(${index})" title="メッセージを削除">🗑️</button>`;
    }

    div.innerHTML = `
      <div class="msg-sender">
        <span>${role === 'user' ? 'あなた' : sessions[currentSessionId]?.name || 'キャラ'}</span>
        ${actionBtns}
      </div>
      <div class="msg-bubble-wrapper">
        <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
      </div>
    `;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function showTypingIndicator() {
    const status = document.getElementById('modelStatus');
    status.innerText = "入力中...";
    status.classList.add('typing');

    document.getElementById('sendBtn').disabled = true;

    const area = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'msg-group ai';
    div.id = 'typingBubble';
    div.innerHTML = `
      <div class="msg-sender">${sessions[currentSessionId]?.name || 'キャラ'}</div>
      <div class="msg-bubble typing-box">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    `;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function hideTypingIndicator() {
    const selectedModel = document.getElementById('modelSelect').value;
    const status = document.getElementById('modelStatus');
    status.innerText = selectedModel;
    status.classList.remove('typing');

    document.getElementById('sendBtn').disabled = false;

    const bubble = document.getElementById('typingBubble');
    if (bubble) bubble.remove();
  }

  function renderChatHistory() {
    const area = document.getElementById('chatArea');
    area.innerHTML = '';
    const session = sessions[currentSessionId];

    if (!session || session.history.length === 0) {
      appendMsg('ai', `「${session?.name}」とのチャットへようこそ！⚙️からプロンプトを設定して話しかけてね。`);
      return;
    }

    session.history.forEach((msg, idx) => {
      appendMsg(msg.role === 'user' ? 'user' : 'ai', msg.parts[0].text, idx);
    });
  }

  async function sendMessage(textOverride = null) {
    const input = document.getElementById('userInput');
    const text = textOverride || input.value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();
    const selectedModel = document.getElementById('modelSelect').value;

    if (!text || !apiKey) {
      alert('APIキーとメッセージを入力してください！');
      return;
    }

    const session = sessions[currentSessionId];

    if (!textOverride) input.value = '';
    
    if (!textOverride) {
      session.history.push({ role: 'user', parts: [{ text }] });
      saveSessions();
      renderChatHistory();
    }

    showTypingIndicator();

    // ★組み込み処理：システムプロンプト ＋ ユーザー設定 ＋ 永続記憶 を結合★
    let sysInstruction = session.sys || '';
    if (session.userSys && session.userSys.trim()) {
      sysInstruction += "\n\n# ユーザー（あなた）の設定\n" + session.userSys.trim();
    }
    if (session.mem && session.mem.trim()) {
      sysInstruction += "\n\n# 永続記憶（過去の出来事・要約）\n" + session.mem.trim();
    }

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: sysInstruction }] },
          contents: session.history
        })
      });

      const data = await res.json();
      hideTypingIndicator();

      if (data.error) {
        throw new Error(data.error.message || 'APIエラーが発生しました');
      }

      const candidate = data.candidates && data.candidates[0];
      if (!candidate || !candidate.content || !candidate.content.parts || candidate.content.parts.length === 0) {
        const reason = candidate?.finishReason || '不明な理由';
        throw new Error(`AIからの返答が空でした（理由: ${reason}）。プロンプトや入力内容を調整してみてください。`);
      }

      const reply = candidate.content.parts[0].text;
      session.history.push({ role: 'model', parts: [{ text: reply }] });
      saveSessions();
      renderChatHistory();
    } catch (e) {
      hideTypingIndicator();
      alert('⚠️ エラーが発生しました: ' + e.message);
      saveSessions();
      renderChatHistory();
    }
  }

  function retryLastUserMessage() {
    const session = sessions[currentSessionId];
    if (!session || session.history.length === 0) return;

    if (session.history[session.history.length - 1].role === 'model') {
      session.history.pop();
    }

    if (session.history.length > 0 && session.history[session.history.length - 1].role === 'user') {
      const lastText = session.history[session.history.length - 1].parts[0].text;
      saveSessions();
      renderChatHistory();
      sendMessage(lastText);
    } else {
      alert('再生成できるメッセージがありません。');
    }
  }

  function endDay() {
    sendMessage('（1日目を終了します。締めくくりのセリフと、概要ノートを出力してください）');
  }
</script>
